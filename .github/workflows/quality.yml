name: Quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      # - run: dart run tool/check_import_boundaries.dart --baseline tool/import_boundaries/baseline.json --check
      - run: flutter test

  firestore-emulator:
    name: Firestore Emulator Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm --prefix firebase-tests ci
      - name: Run Emulator rules suite
        working-directory: firebase-tests
        run: npx --yes firebase-tools@13.35.1 --config firebase.json emulators:exec --project my-dic-sync --only auth,firestore "npm test"
